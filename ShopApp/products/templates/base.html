<div class="card" style="width: 18rem;">
  <img src="{{ product.image_product }}" class="card-img-top" alt="{{ product.name }}">
  <div class="card-body">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text">
      Price: ₹{{ product.price }}<br>
      Stock: {{ product.stock }}
    </p>
    <a href="#" class="btn btn-primary">Buy Now</a>
  </div>
</div>
